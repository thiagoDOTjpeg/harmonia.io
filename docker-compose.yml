version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: harmonia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harmonia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: harmonia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    container_name: harmonia-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "npm run db:generate && npm run build:shared && npm run dev:api"
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/harmonia
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis

  web:
    container_name: harmonia-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: sh -c "npm run build:shared && npm run dev:web"
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
